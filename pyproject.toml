[project]
name = "3dt-2nd-project"
version = "0.1.0"
description = "Azure 데이터 플랫폼 팀 프로젝트 2차 — ADF, Databricks, ML Studio 통합"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "azure-storage-file-datalake>=12.19.0",
    "python-dotenv>=1.0.0",
    "pyodbc>=5.2.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# uv sync --extra ml
ml = [
    "azure-ai-ml>=1.24.0",
    "mlflow>=2.20.0",
]
# uv sync --extra databricks
databricks = [
    "databricks-sdk>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "black>=25.0.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py310"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
