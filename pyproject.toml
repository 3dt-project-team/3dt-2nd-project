[project]
name = "3dt-2nd-project"
version = "0.1.0"
description = "Azure 데이터 플랫폼 팀 프로젝트 2차 — ADF, Databricks, ML Studio 통합"
requires-python = "==3.11.*"

# ── 기본 의존성 ────────────────────────────────────────────────────────────────
# 모든 환경(ADF, Databricks, ML Studio)에서 공통으로 필요한 패키지.
# 설치: uv sync
dependencies = [
    "azure-identity>=1.19.0",                # Managed Identity / az login 인증
    "azure-keyvault-secrets>=4.9.0",         # Key Vault 시크릿 조회
    "azure-storage-file-datalake>=12.19.0",  # ADLS Gen2 파일 접근
    "python-dotenv>=1.0.0",                  # 로컬 .env 파일 로드
    "psycopg[binary]>=3.2.0",               # PostgreSQL 네이티브 드라이버
    "sqlalchemy>=2.0.0",                     # PostgreSQL ORM / pandas read_sql 지원
    "aiohttp>=3.9.0",                       # 비동기 HTTP 클라이언트 (뉴스 본문 수집)
    "beautifulsoup4>=4.12.0",               # HTML 파싱 (기사 본문 추출)
    "pyarrow>=23.0.1",
    "azure-functions>=1.24.0",
    "azure-storage-blob>=12.28.0",
    "azure-core>=1.39.0",
]

# ── 선택 의존성 (extras) ────────────────────────────────────────────────────────
# 필요한 역할에 따라 선택 설치. 기본 uv sync에는 포함되지 않음.
#   ML 엔지니어  : uv sync --extra ml
#   데이터 엔지니어: uv sync --extra databricks
[project.optional-dependencies]
ml = [
    "azure-ai-ml>=1.24.0",  # ML Studio v2 SDK (잡 제출·환경 관리)
    "mlflow>=2.20.0",       # 실험 트래킹 (Git commit hash 태깅)
]
databricks = [
    "databricks-sdk>=0.44.0",  # Repos·클러스터·DBFS API 접근
]

# ── 개발 전용 도구 ──────────────────────────────────────────────────────────────
# 로컬 개발 시 자동 포함 (uv sync).
# 팀원 모두 동일한 버전이 고정되어 코드 스타일 충돌 없음.
[dependency-groups]
dev = [
    "pytest>=8.0.0",   # 테스트 러너
    "ruff>=0.9.0",     # 린터 + import 정렬 (E, F, I 규칙)
    "black>=25.0.0",   # 코드 포매터
    "ty>=0.0.1a6",     # Astral 타입 체커 (Rust 기반 신표준, mypy 대체 방향)
    "pre-commit>=4.0.0",  # Git hook 관리 (린트·포맷·시크릿 감지 자동화)
]

# ── ruff 린터 설정 ──────────────────────────────────────────────────────────────
# E: PEP8 스타일, F: Pyflakes(미사용 변수 등), I: isort(import 정렬)
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
line-length = 100

# ── black 포매터 설정 ───────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── ty 타입 체커 설정 ───────────────────────────────────────────────────────────
# Astral이 개발 중인 Rust 기반 타입 체커. 추후 mypy를 대체할 신표준 방향.
# 실행: uv run ty check src/
# 아직 alpha 단계이므로 CI에서 --error-on-warning 없이 사용 권장.
[tool.ty]
src = ["src"]
python-version = "3.11"

# ── hatchling 빌드 패키지 범위 ──────────────────────────────────────────────────
# 프로젝트 이름(3dt-2nd-project)과 src/ 디렉터리 이름이 달라 hatchling이
# 패키지를 자동 탐색하지 못하므로 명시적으로 지정해야 함.
# 지정하지 않으면 pre-commit / uv pip install -e . 실행 시 build_editable 오류 발생.
[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── 빌드 백엔드 ────────────────────────────────────────────────────────────────
# uv build / pip install -e . 사용 시 필요. 순수 스크립트만 있다면 제거 가능.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
